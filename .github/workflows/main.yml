name: Build and Deploy to Azure App Service

on:
  push:
    branches:
      - main  # Cambia esto si tu rama principal se llama master o de otra forma

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout GitHub Repository
      uses: actions/checkout@v3

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: containeredurag.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        docker build . -t containeredurag.azurecr.io/eduragapp:latest
        docker push containeredurag.azurecr.io/eduragapp:latest

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'EduRag'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: 'containeredurag.azurecr.io/eduragapp:latest'
